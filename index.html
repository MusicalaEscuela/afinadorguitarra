<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Afinador Musicala</title>
  <meta name="description" content="Afinador de Musicala para guitarra, bajo, ukelele, violín y cualquier instrumento: preciso, simple e instalable." />
  <meta name="theme-color" content="#070a18" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MusiTuner" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <img src="assets/logo.png" alt="" class="logo" />
        <h1>Afinador <span>Musicala</span></h1>
      </div>
      <button id="btnSettings" class="icon-button" type="button" aria-expanded="false" aria-controls="settingsPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M16 4.5v5M8 14.5v5" /></svg>
        <span>Ajustes</span>
      </button>
    </header>

    <nav id="instrumentChips" class="chips" aria-label="Instrumento"></nav>

    <section id="settingsPanel" class="settings" hidden>
      <label class="field" id="tuningField">
        <span>Afinación</span>
        <select id="tuningSelect"></select>
      </label>

      <label class="field">
        <span>Tolerancia</span>
        <select id="toleranceSelect">
          <option value="2">Estudio · ±2 cents</option>
          <option value="3">Pro · ±3 cents</option>
          <option value="5" selected>Estándar · ±5 cents</option>
          <option value="8">Principiante · ±8 cents</option>
        </select>
      </label>

      <label class="field">
        <span>Calibración La4 · <strong><span id="a4Value">440</span> Hz</strong></span>
        <input id="a4Input" type="range" min="430" max="450" step="1" value="440" />
      </label>

      <label class="field">
        <span>Nombres de notas</span>
        <select id="namingSelect">
          <option value="letters">C D E F G A B</option>
          <option value="latin">Do Re Mi Fa Sol La Si</option>
        </select>
      </label>

      <label class="field toggle-field">
        <span>Sonido al afinar</span>
        <span class="switch">
          <input id="soundToggle" type="checkbox" checked />
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>

      <button id="btnReset" class="ghost-button" type="button">Restablecer ajustes</button>
    </section>

    <main id="displayCard" class="tuner is-quiet">
      <div class="target-row">
        <div>
          <p class="eyebrow" id="targetEyebrow">Objetivo</p>
          <h2 id="targetLabel">6ª cuerda · E2</h2>
        </div>
        <div class="target-actions">
          <span id="targetFrequency">82.41 Hz</span>
          <button id="btnReference" class="pill-button" type="button">▶ Tono guía</button>
        </div>
      </div>

      <div class="dial-wrap">
        <svg class="dial" viewBox="0 0 320 200" role="img" aria-label="Medidor de afinación en cents">
          <path id="dialRim" class="dial-rim" />
          <path id="dialZone" class="dial-zone" />
          <g id="dialTicks"></g>
          <g id="needle" class="dial-needle">
            <line x1="160" y1="112" x2="160" y2="50" />
            <circle cx="160" cy="50" r="5" />
          </g>
        </svg>
        <span class="side-hint low">♭ baja</span>
        <span class="side-hint high">alta ♯</span>

        <div class="readout" aria-live="polite">
          <div class="note"><span id="detectedNote">--</span><sub id="detectedOctave"></sub></div>
          <div class="cents"><strong id="centsValue">0.0</strong> cents</div>
          <div class="hz" id="detectedFrequency">— Hz</div>
        </div>
      </div>

      <div class="result">
        <p id="precisionText">Esperando señal</p>
        <h3 id="advice">Activa el micrófono y toca una nota.</h3>
      </div>

      <div id="guidedPanel" class="guided-panel" hidden>
        <p id="guidedInstruction" class="guided-instruction"></p>
      </div>

      <div id="stringsBlock" class="strings-block">
        <div id="stringButtons" class="string-buttons" aria-label="Cuerda"></div>
        <p id="modeLabel" class="mode-label"></p>
      </div>

      <div class="actions">
        <button id="btnMic" class="primary-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" /></svg>
          <span id="btnMicLabel">Activar micrófono</span>
        </button>
        <button id="btnGuided" class="secondary-button" type="button">Modo guiado</button>
      </div>
      <p id="permissionHint" class="hint"></p>

      <div class="quality" aria-label="Calidad de lectura">
        <div class="quality-item"><span>Señal</span><div class="mini-meter"><div id="signalFill"></div></div></div>
        <div class="quality-item"><span>Claridad</span><div class="mini-meter"><div id="confidenceFill"></div></div></div>
        <div class="quality-item"><span>Estabilidad</span><div class="mini-meter"><div id="stabilityFill"></div></div></div>
      </div>
    </main>

    <button id="installHint" class="install-button" hidden type="button">Instalar afinador</button>

    <footer class="footer">
      Toca una sola nota, déjala sonar y ajusta poco a poco. <span id="appVersion"></span>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
